name: Update generated files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update generated files
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update generated files
        shell: bash
        run: |
          bash ./update.sh

      - name: Verify generated files
        shell: bash
        run: |
          bash ./apply-templates.sh
          git diff --check

      - name: Show changes
        shell: bash
        run: |
          git status --short
          git --no-pager diff

      - name: Commit generated files
        shell: bash
        run: |
          mapfile -t generated_files < <(
            python3 <<'PY'
          import json

          with open("versions.json", "r", encoding="utf-8") as f:
              versions = json.load(f)

          for major, major_data in versions.items():
              for variant in major_data.get("variants", []):
                  prefix = f"{major}/{variant}"

                  print(f"{prefix}/Dockerfile")
                  print(f"{prefix}/requirements.in")
                  print(f"{prefix}/requirements.lock")
          PY
          )

          printf 'Generated files:\n'
          printf '  %s\n' "${generated_files[@]}"

          git add -- "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git diff --cached --check
          git --no-pager diff --cached

          git commit -m "Update generated build files"
          git push
